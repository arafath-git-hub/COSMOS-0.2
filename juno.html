<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050816">
  <meta name="description" content="Explore NASA's Juno mission to Jupiter, its scientific instruments, and discoveries about the giant planet.">
  <title>Juno Mission | COSMOS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050816;
      --panel: rgba(16, 28, 48, 0.8);
      --border: rgba(130, 196, 255, 0.2);
      --blue: #82c4ff;
      --cyan: #85f0ff;
      --purple: #a9a0ff;
      --gold: #ffd7a0;
      --text: #f1f6ff;
      --muted: #adbed5;
      --font-main: "Inter", sans-serif;
      --font-display: "Orbitron", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 24px;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 80% 5%, rgba(81, 105, 175, 0.17), transparent 35%),
        radial-gradient(ellipse at 8% 48%, rgba(69, 51, 145, 0.13), transparent 32%),
        #050816;
      font-family: var(--font-main);
      line-height: 1.7;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    body::before {
      opacity: 0.62;
      background-image:
        radial-gradient(1px 1px at 8% 14%, #fff 50%, transparent 100%),
        radial-gradient(2px 2px at 25% 72%, #8bdcff 50%, transparent 100%),
        radial-gradient(1px 1px at 46% 31%, #fff 50%, transparent 100%),
        radial-gradient(2px 2px at 65% 16%, #c6cfff 50%, transparent 100%),
        radial-gradient(1px 1px at 82% 63%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 94% 28%, #85f0ff 50%, transparent 100%),
        radial-gradient(1px 1px at 15% 89%, #fff 50%, transparent 100%),
        radial-gradient(2px 2px at 73% 87%, #c2a8ff 50%, transparent 100%);
      background-size: 370px 320px;
      animation: starDrift 100s linear infinite;
    }

    body::after {
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(5, 8, 22, 0.06) 65%,
        rgba(5, 8, 22, 0.62) 100%
      );
    }

    .mission-detail {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 35px 0 90px;
      position: relative;
    }

    /* Back button */

    .mission-back {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 2;
      margin-bottom: 28px;
      padding: 11px 17px;
      border: 1px solid rgba(130, 196, 255, 0.3);
      border-radius: 12px;
      background: rgba(12, 25, 49, 0.76);
      color: #c9e8ff;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease, border-color 0.3s ease,
        background 0.3s ease, box-shadow 0.3s ease;
    }

    .mission-back .arrow {
      font-size: 1.2rem;
      transition: transform 0.3s ease;
    }

    .mission-back:hover {
      transform: translateY(-3px);
      border-color: var(--cyan);
      background: rgba(28, 61, 92, 0.62);
      box-shadow: 0 0 25px rgba(130, 196, 255, 0.14);
    }

    .mission-back:hover .arrow {
      transform: translateX(-4px);
    }

    /* Hero */

    .mission-hero {
      min-height: 420px;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: clamp(30px, 6vw, 72px);
      margin-bottom: 28px;
      border: 1px solid rgba(130, 196, 255, 0.25);
      border-radius: 28px;
      background:
        radial-gradient(ellipse at 83% 45%, rgba(119, 149, 216, 0.18), transparent 34%),
        linear-gradient(125deg, #101a2b, #1c2c40 55%, #101427);
      box-shadow:
        0 20px 80px rgba(0, 0, 0, 0.24),
        inset 0 0 55px rgba(130, 196, 255, 0.035);
    }

    .mission-hero::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 330px;
      height: 330px;
      top: 50%;
      right: -40px;
      border: 1px solid rgba(130, 196, 255, 0.23);
      border-radius: 50%;
      transform: translateY(-50%);
      box-shadow:
        0 0 0 32px rgba(130, 196, 255, 0.035),
        0 0 0 65px rgba(130, 196, 255, 0.022),
        0 0 55px rgba(130, 196, 255, 0.1);
      animation: orbitPulse 7s ease-in-out infinite;
    }

    .jupiter-planet {
      position: absolute;
      z-index: -1;
      width: 220px;
      height: 220px;
      top: 50%;
      right: 10px;
      border-radius: 50%;
      transform: translateY(-50%);
      background:
        radial-gradient(ellipse at 68% 46%, #d7b7a1 0 5%, transparent 6%),
        radial-gradient(ellipse at 35% 31%, rgba(115, 71, 54, 0.72) 0 6%, transparent 7%),
        radial-gradient(ellipse at 60% 67%, rgba(145, 91, 68, 0.55) 0 8%, transparent 9%),
        repeating-linear-gradient(
          0deg,
          #d9c3a8 0 12px,
          #9b705c 13px 22px,
          #e7d3b8 23px 33px,
          #ba8b70 34px 41px,
          #ead6bd 42px 53px
        );
      box-shadow:
        inset -28px -12px 38px rgba(0, 0, 0, 0.65),
        inset 10px 7px 20px rgba(255, 236, 205, 0.22),
        0 0 55px rgba(164, 186, 255, 0.18);
      animation: planetFloat 8s ease-in-out infinite;
    }

    .jupiter-planet::before {
      content: "";
      position: absolute;
      width: 34px;
      height: 21px;
      top: 54%;
      left: 57%;
      border-radius: 50%;
      transform: rotate(-12deg);
      background: linear-gradient(135deg, #c37b60, #8b483c);
      box-shadow: inset 0 0 7px rgba(75, 30, 26, 0.45);
    }

    .jupiter-planet::after {
      content: "";
      position: absolute;
      inset: -10px;
      border: 1px solid rgba(166, 195, 255, 0.23);
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(130, 196, 255, 0.1);
    }

    .hero-content {
      max-width: 700px;
      position: relative;
      z-index: 1;
    }

    .mission-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: var(--cyan);
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .mission-label::before {
      content: "";
      width: 26px;
      height: 1px;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }

    .mission-hero h1 {
      margin-bottom: 20px;
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 7vw, 5.2rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -2px;
      background: linear-gradient(100deg, #fff 5%, #d5eaff 50%, #aebaff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 25px rgba(130, 196, 255, 0.12));
    }

    .hero-description {
      max-width: 690px;
      color: #d0dceb;
      font-size: 1.02rem;
      line-height: 1.95;
    }

    .hero-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 25px;
      color: #b3c6df;
      font-size: 0.82rem;
      letter-spacing: 0.4px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #85f0c4;
      box-shadow: 0 0 14px rgba(133, 240, 196, 0.8);
      animation: statusPulse 2s ease-in-out infinite;
    }

    /* Facts */

    .mission-facts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
      margin: 24px 0 38px;
    }

    .mission-fact {
      min-width: 0;
      position: relative;
      overflow: hidden;
      padding: 24px 20px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: linear-gradient(145deg, rgba(24, 39, 64, 0.77), rgba(9, 16, 35, 0.82));
      backdrop-filter: blur(14px);
      transition: transform 0.35s ease, border-color 0.35s ease,
        box-shadow 0.35s ease;
    }

    .mission-fact::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      width: 70%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--blue), transparent);
      opacity: 0.75;
    }

    .mission-fact:hover {
      transform: translateY(-6px);
      border-color: rgba(133, 240, 255, 0.48);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.2), 0 0 25px rgba(130, 196, 255, 0.07);
    }

    .mission-fact span {
      display: block;
      margin-bottom: 9px;
      color: #92b7e2;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .mission-fact strong {
      display: block;
      color: #eaf5ff;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    /* Sections */

    .mission-section {
      position: relative;
      overflow: hidden;
      margin-top: 20px;
      padding: clamp(24px, 4vw, 36px);
      border: 1px solid rgba(130, 196, 255, 0.16);
      border-radius: 20px;
      background: linear-gradient(140deg, rgba(17, 30, 54, 0.84), rgba(8, 15, 32, 0.8));
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(12px);
      transition: border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .mission-section::before {
      content: "";
      position: absolute;
      left: 0;
      top: 28px;
      bottom: 28px;
      width: 2px;
      background: linear-gradient(180deg, var(--cyan), rgba(130, 196, 255, 0.06));
      box-shadow: 0 0 12px rgba(133, 240, 255, 0.3);
    }

    .mission-section:hover {
      border-color: rgba(130, 196, 255, 0.3);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.16);
    }

    .mission-section h2 {
      margin-bottom: 17px;
      color: #eaf5ff;
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 2.5vw, 1.55rem);
      font-weight: 600;
      line-height: 1.45;
    }

    .mission-section h2::after {
      content: "";
      display: block;
      width: 48px;
      height: 2px;
      margin-top: 13px;
      background: linear-gradient(90deg, var(--cyan), transparent);
    }

    .mission-section p,
    .mission-section li {
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.95;
    }

    .mission-section p + p {
      margin-top: 15px;
    }

    .mission-section ul {
      display: grid;
      gap: 14px;
      padding-left: 0;
      list-style: none;
    }

    .mission-section li {
      position: relative;
      padding-left: 27px;
    }

    .mission-section li::before {
      content: "";
      position: absolute;
      top: 11px;
      left: 1px;
      width: 8px;
      height: 8px;
      border: 1px solid var(--cyan);
      border-radius: 2px;
      transform: rotate(45deg);
      box-shadow: 0 0 9px rgba(133, 240, 255, 0.25);
    }

    .mission-section li strong {
      color: #e3f2ff;
      font-weight: 600;
    }

    .mission-highlight {
      position: relative;
      margin-top: 22px;
      padding: 19px 22px;
      border: 1px solid rgba(130, 196, 255, 0.18);
      border-left: 3px solid var(--blue);
      border-radius: 0 12px 12px 0;
      background: linear-gradient(90deg, rgba(71, 127, 190, 0.12), rgba(71, 127, 190, 0.015));
      color: #dcecff;
      font-size: 0.95rem;
      line-height: 1.9;
    }

    .mission-highlight strong {
      color: var(--cyan);
    }

    /* Explore buttons */

    .mission-navigation {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
      margin-top: 22px;
    }

    .mission-navigation a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 46px;
      padding: 12px 19px;
      border: 1px solid rgba(130, 196, 255, 0.3);
      border-radius: 11px;
      background: rgba(25, 48, 78, 0.42);
      color: #e1f1ff;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.3s ease, border-color 0.3s ease,
        background 0.3s ease, box-shadow 0.3s ease;
    }

    .mission-navigation a:hover {
      transform: translateY(-3px);
      border-color: var(--cyan);
      background: rgba(47, 92, 132, 0.3);
      box-shadow: 0 8px 25px rgba(130, 196, 255, 0.1);
    }

    .mission-navigation a.primary-link {
      border-color: rgba(133, 240, 255, 0.48);
      background: linear-gradient(110deg, rgba(37, 101, 145, 0.34), rgba(83, 77, 155, 0.25));
    }

    .external-arrow {
      color: var(--cyan);
      font-size: 1.05rem;
    }

    /* Scroll reveal */

    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.75s ease,
        transform 0.75s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .mission-fact:nth-child(2) {
      transition-delay: 80ms;
    }

    .mission-fact:nth-child(3) {
      transition-delay: 160ms;
    }

    .mission-fact:nth-child(4) {
      transition-delay: 240ms;
    }

    /* Animation keyframes */

    @keyframes starDrift {
      from { background-position: 0 0; }
      to { background-position: 370px 320px; }
    }

    @keyframes orbitPulse {
      0%, 100% {
        opacity: 0.55;
        transform: translateY(-50%) scale(0.96);
      }
      50% {
        opacity: 1;
        transform: translateY(-50%) scale(1.04);
      }
    }

    @keyframes planetFloat {
      0%, 100% { transform: translateY(-50%) translateX(0); }
      50% { transform: translateY(calc(-50% - 12px)) translateX(-5px); }
    }

    @keyframes statusPulse {
      0%, 100% {
        opacity: 1;
        box-shadow: 0 0 14px rgba(133, 240, 196, 0.8);
      }
      50% {
        opacity: 0.55;
        box-shadow: 0 0 5px rgba(133, 240, 196, 0.4);
      }
    }

    /* Responsive */

    @media (max-width: 850px) {
      .mission-facts {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .mission-hero::before {
        right: -135px;
      }

      .jupiter-planet {
        right: -70px;
        opacity: 0.48;
      }

      .hero-content {
        max-width: 100%;
      }

      .hero-description {
        max-width: 620px;
      }
    }

    @media (max-width: 600px) {
      .mission-detail {
        width: calc(100% - 28px);
        padding-top: 20px;
        padding-bottom: 55px;
      }

      .mission-back {
        margin-bottom: 20px;
        padding: 10px 13px;
        font-size: 0.82rem;
      }

      .mission-hero {
        min-height: auto;
        padding: 34px 23px;
        border-radius: 21px;
      }

      .mission-hero::before {
        width: 210px;
        height: 210px;
        right: -125px;
        top: 27%;
      }

      .jupiter-planet {
        width: 130px;
        height: 130px;
        right: -65px;
        top: 27%;
        opacity: 0.4;
      }

      .mission-label {
        font-size: 0.62rem;
        letter-spacing: 2px;
      }

      .mission-hero h1 {
        max-width: 100%;
        font-size: clamp(2rem, 10vw, 3.2rem);
        letter-spacing: -1px;
      }

      .hero-description {
        font-size: 0.91rem;
        line-height: 1.85;
      }

      .hero-status {
        align-items: flex-start;
        font-size: 0.76rem;
      }

      .mission-facts {
        gap: 11px;
        margin: 18px 0 27px;
      }

      .mission-fact {
        padding: 18px 15px;
        border-radius: 14px;
      }

      .mission-fact span {
        font-size: 0.65rem;
        letter-spacing: 1px;
      }

      .mission-fact strong {
        font-size: 0.9rem;
      }

      .mission-section {
        margin-top: 15px;
        padding: 24px 20px;
        border-radius: 16px;
      }

      .mission-section::before {
        top: 22px;
        bottom: 22px;
      }

      .mission-section h2 {
        font-size: 1.1rem;
      }

      .mission-section p,
      .mission-section li {
        font-size: 0.89rem;
        line-height: 1.85;
      }

      .mission-highlight {
        padding: 15px 16px;
        font-size: 0.88rem;
      }

      .mission-navigation {
        flex-direction: column;
      }

      .mission-navigation a {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
